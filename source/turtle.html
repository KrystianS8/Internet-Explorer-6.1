/* ---------------- TRIDENT / IE USERDATA SAVE SYSTEM ---------------- */

function saveChats() {
    try {
        var box = document.getElementById("storage");
        if (!box || !box.save) return;

        var data = "";
        for (var i = 0; i < chats.length; i++) {
            var c = chats[i];
            data += "[CHAT]" + c.title + "\n";
            for (var j = 0; j < c.messages.length; j++) {
                var m = c.messages[j];
                data += m.sender + ":" + m.text + "\n";
            }
            data += "[END]\n";
        }

        box.setAttribute("chats", data);
        box.save("turtleChats");
    } catch (e) {
        // Fallback or silent catch if local file security restricts userData
    }
}

function loadChats() {
    try {
        var box = document.getElementById("storage");
        if (!box || !box.load) return;

        box.load("turtleChats");
        var data = box.getAttribute("chats");
        if (!data) return;

        var lines = data.split("\n");
        var current = null;

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (line.indexOf("[CHAT]") == 0) {
                var title = line.substring(6);
                current = { title:title, messages:[] };
                chats.push(current);
            }
            else if (line.indexOf("[END]") == 0) {
                current = null;
            }
            else if (current && line.indexOf(":") != -1) {
                var parts = line.split(":");
                current.messages.push({ sender:parts[0], text:parts.slice(1).join(":") });
            }
        }
    } catch (e) {
        // Fallback if loading fails
    }
}

function createChat(title) {
    var chat = {
        title: title,
        messages: []

    chats.push(chat);
    renderChatList();
    saveChats();
    return chats.length - 1;
}

function getCurrentChat() {
    return chats[currentChatIndex];

function renderChatList() {
    chatListBox.innerHTML = "";
    for (var i = 0; i < chats.length; i++) {
        var div = document.createElement("div");
        div.className = "chatItem" + (i == currentChatIndex ? " chatItemActive" : "");
        div.innerHTML = chats[i].title;
        div.onclick = (function(index) {
            return function() {
                openChat(index);
            };
        })(i);
        chatListBox.appendChild(div);
    }
}

function renderChat(index) {
    var chat = chats[index];
    chatBox.innerHTML = "";
    for (var i = 0; i < chat.messages.length; i++) {
        var m = chat.messages[i];
        chatBox.innerHTML += "<b>" + m.sender + ":</b> " + m.text + "<br>";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addMessage(sender, text) {
    var chat = getCurrentChat();
    chat.messages.push({ sender: sender, text: text });
    chatBox.innerHTML += "<b>" + sender + ":</b> " + text + "<br>";
    chatBox.scrollTop = chatBox.scrollHeight;
    saveChats();
}

function chatLoading(totalChars, callback) {
    var frames = ["-", "\\", "|", "/"];
    var cycles = Math.floor(totalChars / 20);
    if (cycles < 1) cycles = 1;
    if (cycles > 10) cycles = 10;
    var totalFrames = cycles * frames.length;
    var index = 0;

    chatBox.innerHTML = "Loading chat... <span id='chatloader'>-</span><br>";
    chatBox.scrollTop = chatBox.scrollHeight;

    function nextFrame() {
        var loader = document.getElementById("chatloader");
        if (!loader) return;
        loader.innerHTML = frames[index % frames.length];
        index++;
        if (index < totalFrames) {
            setTimeout(nextFrame, 220);
        } else {
            callback();
        }
    }
    nextFrame();
}

function openChat(index) {
    var chat = chats[index];
    var totalChars = 0;
    for (var i = 0; i < chat.messages.length; i++) {
        totalChars += chat.messages[i].text.length;
    }
    currentChatIndex = index;
    renderChatList();
    chatLoading(totalChars, function() {
        renderChat(index);
    });
}

function turtleLoading(msg, callback) {

    var cycles = Math.floor(msg.length / 5);
    if (cycles < 1) cycles = 1;

    var totalFrames = cycles * frames.length;

        var loader = document.getElementById("loader");

            setTimeout(nextFrame, 220);

            loader.parentNode.removeChild(loader);

        }
    }

}

/* ---------------- MATH ENGINE ---------------- */

function evalExpression(expr) {
    expr = expr.replace(/[^0-9\+\-\*\/\^\(\)\.\s]/g, "");
    expr = expr.replace(/\s+/g, "");

    var tokens = [];
    var number = "";
    var i, ch;

    for (i = 0; i < expr.length; i++) {
        ch = expr.charAt(i);
        if ((ch >= "0" && ch <= "9") || ch == ".") {
            number += ch;
        } else {
            if (number.length > 0) {
                tokens.push(number);
                number = "";
            }
            tokens.push(ch);
        }
    }
    if (number.length > 0) tokens.push(number);

    var output = [];
    var ops = [];

    function precedence(op) {
        if (op == "^") return 4;
        if (op == "*" || op == "/") return 3;
        if (op == "+" || op == "-") return 2;
        return 0;
    }

    function isRightAssociative(op) {
        return op == "^";
    }

    for (i = 0; i < tokens.length; i++) {
        var t = tokens[i];
        if (!isNaN(t)) {
            output.push(t);
        } else if (t == "+" || t == "-" || t == "*" || t == "/" || t == "^") {
            while (ops.length > 0) {
                var top = ops[ops.length - 1];
                if (top == "(") break;
                if (precedence(top) > precedence(t) ||
                    (precedence(top) == precedence(t) && !isRightAssociative(t))) {
                    output.push(ops.pop());
                } else break;
            }
            ops.push(t);
        } else if (t == "(") {
            ops.push(t);
        } else if (t == ")") {
            while (ops.length > 0 && ops[ops.length - 1] != "(") {
                output.push(ops.pop());
            }
            ops.pop();
        }
    }

    while (ops.length > 0) output.push(ops.pop());

    var stack = [];
    for (i = 0; i < output.length; i++) {
        var tok = output[i];
        if (!isNaN(tok)) {
            stack.push(Number(tok));
        } else {
            var b = stack.pop();
            var a = stack.pop();
            if (tok == "+") stack.push(a + b);
            else if (tok == "-") stack.push(a - b);
            else if (tok == "*") stack.push(a * b);
            else if (tok == "/") {
                if (b == 0) return "You can't divide by zero.";
                stack.push(a / b);
            } else if (tok == "^") {
                var res = 1;
                for (var j = 0; j < Math.floor(b); j++) res *= a;
                stack.push(res);
            }
        }
    }

    return stack.length == 1 ? stack[0] : "I couldn't understand that math.";
}

function handleNaturalLanguageMath(lower) {
    var addMatch = lower.match(/add\s+(\d+)/);
    var subMatch = lower.match(/subtract\s+(\d+)/);
    var mulMatch = lower.match(/multiply\s+by\s+(\d+)/);
    var divMatch = lower.match(/divide\s+by\s+(\d+)/);

    if (addMatch) return Number(addMatch[1]);
    if (subMatch) return -Number(subMatch[1]);
    if (mulMatch) return 0;
    if (divMatch) {
        var n = Number(divMatch[1]);
        if (n == 0) return "You can't divide by zero.";
        return 0;
    }

    return null;
}

/* ---------------- INPUT HANDLER ---------------- */

var turtleIsTalking = false;

function processInput() {

    // BLOCK INPUT WHILE TURTLE IS TALKING
    if (turtleIsTalking) return;

    var msg = inputBox.value;

    // BASIC EMPTY CHECK (IE6-safe)
    if (msg == "" || msg == " " || msg == "  ") return;

    var userName = nameBox.value || "User";
    inputBox.value = "";

    addMessage(userName, msg);

    // TURTLE STARTS TALKING → DISABLE INPUT
    turtleIsTalking = true;
    inputBox.disabled = true;
    inputBox.style.backgroundColor = "#dddddd";

    turtleLoading(msg, function() {

        addMessage("Turtle", turtleReply(msg, userName));
        saveChats();

        // TURTLE FINISHED → ENABLE INPUT
        turtleIsTalking = false;
        inputBox.disabled = false;
        inputBox.style.backgroundColor = "";
        inputBox.focus();
    });
}

inputBox.onkeydown = function(e) {
    e = e || window.event;

    // ENTER key
    if (e.keyCode == 13) {
        processInput();
    }
};

sendBtn.onclick = function() {
    processInput();
};




/* ---------------- NEW CHAT ---------------- */

newChatBtn.onclick = function() {
    var index = createChat("Chat " + (chats.length));
    currentChatIndex = index;
    renderChatList();
    renderChat(index);
    saveChats();
};

/* ---------------- RENAME CHAT ---------------- */

renameChatBtn.onclick = function() {
    var chat = getCurrentChat();
    var newName = prompt("What is the new name?");

    if (newName === null) return;

    newName = newName.replace(/^\s+|\s+$/g, "");

    if (newName.length == 0) return;

    chat.title = newName;
    renderChatList();
    saveChats();
};

/* ---------------- DELETE CHAT ---------------- */

deleteChatBtn.onclick = function() {
    var chat = getCurrentChat();

    var confirmDelete = confirm(
        "Are you sure you want to delete this chat? This will remove everything saved and cannot be undone."
    );

    if (!confirmDelete) return;

    chat.title = "Deleting...";
    renderChatList();

    var frames = ["-", "\\", "|", "/"];
    var totalFrames = frames.length * 6;
    var index = 0;

    chatBox.innerHTML = "Deleting chat... <span id='deleteLoader'>-</span><br>";
    chatBox.scrollTop = chatBox.scrollHeight;

    function nextFrame() {
        var loader = document.getElementById("deleteLoader");
        if (!loader) return;

        loader.innerHTML = frames[index % frames.length];
        index++;

        if (index < totalFrames) {
            setTimeout(nextFrame, 220);
        } else {
            chats.splice(currentChatIndex, 1);

            if (chats.length == 0) {
                var newIndex = createChat("Chat 1");
                openChat(newIndex);
                saveChats();
                return;
            }

            currentChatIndex = 0;
            renderChatList();
            openChat(0);
            saveChats();
        }
    }

    nextFrame();
};

/* ---------------- STARTUP ---------------- */

loadChats();

if (chats.length == 0) {
    createChat("Chat 1");
}

renderChatList();
renderChat(0);
